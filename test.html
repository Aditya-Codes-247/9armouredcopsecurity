<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9 Armoured Cop Security</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Belinzie';
    src: url('Belinzie-Regular.woff2') format('woff2'),
         url('Belinzie-Regular.otf') format('opentype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Belinzie';
    src: url('Belinzie-Italic.woff2') format('woff2'),
         url('Belinzie-Italic.otf') format('opentype');
    font-weight: 400;
    font-style: italic;
    font-display: swap;
  }

  :root {
    --gold: #a9812f;
    --gold-light: #e2c377;
    --gold-pale: #fff6de;
    --gold-dark: #7c5e22;
    --cream: #fdfaf3;
    --ink: #1c1a16;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 35%, #ffffff 0%, var(--cream) 55%, #f2ead6 100%);
    overflow: hidden;
    font-family: sans-serif;
  }

  .stage {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4rem 2rem;
  }

  .ambient {
    position: absolute;
    width: 60vmin;
    height: 60vmin;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(169,129,47,0.10) 0%, rgba(169,129,47,0) 70%);
    pointer-events: none;
    z-index: 0;
  }

  .brand {
    position: relative;
    z-index: 1;
    text-align: center;
    opacity: 0;
    filter: blur(20px);
    animation: blurIn 1.7s cubic-bezier(.22,.7,.2,1) forwards;
  }

  .brand-main {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.15em;
    flex-wrap: wrap;
  }

  .nine-svg {
    width: clamp(110px, 15vw, 210px);
    height: auto;
    overflow: visible;
    display: block;
    margin: 0 0.05em;
  }

  .nine-fill {
    font-family: 'Belinzie', 'Cinzel', serif;
    font-weight: 800;
  }

  .nine-stroke {
    font-family: 'Belinzie', 'Cinzel', serif;
    font-weight: 800;
    stroke-dasharray: 18 26;
    stroke-linecap: round;
    opacity: 0;
  }

  .nine-stroke.flow {
    opacity: 1;
    animation: flowBorder 3.2s linear infinite;
  }

  .name-text {
    font-family: 'Belinzie', 'Cinzel', serif;
    font-weight: 600;
    font-size: clamp(1.4rem, 6vw, 2.7rem);
    letter-spacing: 0.1em;
    color: var(--gold);
    text-transform: uppercase;
  }

  .subtitle {
    margin-top: 0.5rem;
    font-family: 'Belinzie', 'Playfair Display', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(0.9rem, 3.2vw, 1.35rem);
    letter-spacing: 0.3em;
    color: var(--ink);
  }

  @keyframes blurIn {
    0%   { opacity: 0; filter: blur(20px); transform: translateY(12px); }
    100% { opacity: 1; filter: blur(0);    transform: translateY(0); }
  }

  /* 44 = one full cycle of the 18/26 dash pattern, so the loop is seamless */
  @keyframes flowBorder {
    to { stroke-dashoffset: -440; }
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="ambient"></div>
    <div class="brand" id="brand">
      <div class="brand-main">
        <svg class="nine-svg" id="nineSvg" viewBox="0 0 220 240" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="nineFillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#c89a4a"/>
              <stop offset="100%" stop-color="#7c5e22"/>
            </linearGradient>
            <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="var(--gold-pale)"/>
              <stop offset="50%" stop-color="var(--gold-light)"/>
              <stop offset="100%" stop-color="var(--gold)"/>
            </linearGradient>
            <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>

          <text x="50%" y="58%" text-anchor="middle" dominant-baseline="central"
                class="nine-fill" font-size="190" fill="url(#nineFillGrad)">9</text>

          <text x="50%" y="58%" text-anchor="middle" dominant-baseline="central"
                class="nine-stroke" id="nineStroke" font-size="190"
                fill="none" stroke="url(#flowGrad)" stroke-width="4"
                filter="url(#softGlow)">9</text>
        </svg>

        <span class="name-text">Armoured Cop</span>
      </div>
      <div class="subtitle">Security Service</div>
    </div>
  </div>

<script>
  const brand = document.getElementById('brand');
  const nineStroke = document.getElementById('nineStroke');

  brand.addEventListener('animationend', function onIntroEnd(e) {
    if (e.animationName === 'blurIn') {
      nineStroke.classList.add('flow');
      brand.removeEventListener('animationend', onIntroEnd);
    }
  });
</script>

</body>
</html>
